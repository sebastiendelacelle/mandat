<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&text=0123456789&display=swap" rel="stylesheet">
<style>
:root {
  /* Charte « Mairie » : un serious game civique. Fond clair, encre bleu nuit, bleu de la République pour l’exercice du pouvoir, rouge pour la campagne. */
  --ink: #f4f6fa;      /* fond de page */
  --panel: #ffffff;    /* cartes */
  --raise: #eef1f7;    /* surfaces secondaires */
  --line: #dde2ec;
  --text: #1b1f3b;
  --muted: #5d6478;
  --accent: #2337a8;
  --paper: #1b1f3b;    /* texte d’emphase */
  --good: #18753c;
  --warn: #a95a06;
  --bad: #ce0500;
  --f-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-ui: 'Public Sans', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --f-num: 'Source Serif 4', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font: 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
a { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- structure ---------- */
#app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: rgba(16,19,24,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
.brand { font: 800 22px/1 var(--f-display); letter-spacing: .02em; }
.brand b { color: var(--accent); }
.date { font: 600 16px/1.1 var(--f-display); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; white-space: nowrap; }
.chip.red { border-color: var(--accent); color: var(--paper); background: rgba(217,73,59,.18); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.stats { display: flex; gap: 16px; margin-left: auto; align-items: center; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat .num { font-size: 15px; }
.hbar { width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.hbar i { display: block; height: 100%; background: var(--paper); }
nav.tabs { display: flex; gap: 2px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: none; border: 0; padding: 9px 12px 10px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
nav.tabs button .badge { background: var(--accent); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
main { flex: 1; padding: 16px; max-width: 1180px; width: 100%; margin: 0 auto; padding-bottom: 96px; }
.endbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(16,19,24,.97) 30%); pointer-events: none; }
.endbar > * { pointer-events: auto; }

/* ---------- éléments ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 860px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card h3 { font-size: 17px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card h3 .muted { font: 400 12.5px var(--f-ui); margin-left: auto; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 12px 22px; font-size: 16px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.sep { height: 1px; background: var(--line); margin: 10px 0; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #fff; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.kpi small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi .v { font: 600 22px/1.2 var(--f-num); }
.kpi .gauge { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.kpi .gauge i { display: block; height: 100%; }
.list { display: flex; flex-direction: column; }
.li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 52px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13.5px; }
.bars .track { height: 14px; background: var(--raise); border-radius: 3px; overflow: hidden; }
.bars .track i { display: block; height: 100%; }
.bars .b.pj .lab { font-weight: 700; color: var(--paper); }
.diverge { position: relative; height: 12px; background: var(--raise); border-radius: 3px; }
.diverge::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.diverge i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.log-good { color: var(--good); } .log-bad { color: var(--bad); } .log-event { color: var(--warn); }

/* ---------- La Une ---------- */
.une { background: var(--paper); color: #1b1a17; border-radius: 6px; padding: 16px 18px 18px; position: relative; overflow: hidden; }
.une .mast { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-right: 48px; border-bottom: 3px double #1b1a17; padding-bottom: 6px; margin-bottom: 10px; }
.une .mast b { font: 800 26px/1 var(--f-display); letter-spacing: -.01em; }
.une .mast span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.une h2 { font: 800 clamp(26px, 4vw, 40px)/1.05 var(--f-display); letter-spacing: -.015em; }
.une p { font: 400 15px/1.5 var(--f-display); margin: 10px 0 0; max-width: 65ch; }
.une .flash { position: absolute; top: 14px; right: -36px; transform: rotate(35deg); background: var(--accent); color: #fff; padding: 3px 44px; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.une .sub { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; border-top: 1px solid #1b1a17; padding-top: 10px; }
.une .sub div { font: 600 14.5px/1.3 var(--f-display); }
.une .sub small { display: block; font: 500 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: #6b665c; margin-bottom: 2px; }

/* ---------- actions ---------- */
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.act { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.act:hover:not(.off) { border-color: var(--muted); }
.act.off { opacity: .5; cursor: not-allowed; }
.act .t { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.act .t .num { font-weight: 400; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.act .d { font-size: 13px; color: var(--muted); }
.act .why { font-size: 12px; color: var(--warn); }
.act .ai { font-size: 11px; color: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; align-self: flex-start; }
.cat-h { margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.cat-h h3 { font-size: 18px; }

/* ---------- X ---------- */
.tweet { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tweet .h { font-size: 13px; color: var(--muted); }
.tweet .h b { color: var(--text); }
.tweet.me { background: rgba(217,73,59,.07); margin: 0 -14px; padding: 10px 14px; }

/* ---------- carte ---------- */
.map { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 64px); gap: 5px; }
.map .tile { border-radius: 6px; padding: 6px; font-size: 11.5px; line-height: 1.15; color: #fff; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid transparent; }
.map .tile.me { border-color: var(--paper); }
.map .tile b { font: 700 15px var(--f-num); }

/* ---------- modales ---------- */
.ov { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); z-index: 50; background: rgba(5,6,8,.6); display: flex; align-items: flex-start; justify-content: center; padding: 8px; }
@media (min-width: 700px) { .ov { align-items: center; padding: 20px; } }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 640px; max-height: 100%; overflow: auto; padding: 16px 16px 0; overscroll-behavior: contain; }
.modal > :last-child { margin-bottom: 16px; }
.modal .foot { position: sticky; bottom: 0; background: var(--panel); padding: 10px 0 14px; margin: 0 !important; }
.modal.chat { height: 100%; display: flex; flex-direction: column; padding-bottom: 12px; }
.modal.chat > :last-child { margin-bottom: 0; }
.chatlog { flex: 1; min-height: 60px; overflow: auto; margin: 8px 0; }
.chatin { display: flex; flex-direction: column; gap: 8px; }
.chatin textarea { min-height: 56px !important; }
.hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
.hint p { margin: 0; }
details.own summary, details.ko summary { cursor: pointer; color: var(--muted); padding: 8px 0; }
details.own textarea { min-height: 80px !important; }
.modal h2 { font-size: 21px; margin-bottom: 8px; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.modal textarea, .modal input[type=text], .modal select, .field { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.modal textarea { min-height: 96px; resize: vertical; display: block; }
.opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt.sel { border-color: var(--accent); background: rgba(217,73,59,.12); }
.opt small { display: block; color: var(--muted); }
.bubble { padding: 9px 12px; border-radius: 10px; margin: 6px 0; max-width: 88%; }
.bubble.them { background: var(--raise); }
.bubble.me { background: rgba(217,73,59,.16); margin-left: auto; }
.bubble b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 82px; z-index: 60; background: var(--paper); color: #1b1a17; padding: 10px 16px; border-radius: 8px; max-width: min(560px, 92vw); box-shadow: 0 10px 30px rgba(0,0,0,.5); font-weight: 500; }

/* ---------- simplification ---------- */
.small { font-size: 13px; }
.aidot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.phase { background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; padding: 4px 16px; }
.muted-on { opacity: .75; font-weight: 500; margin-left: 4px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--paper); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.obj { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.obj h2 { font-size: clamp(22px, 3.2vw, 30px); }
.obj p { margin: 0; color: #cfc9bb; max-width: 70ch; }
.obj .left { font-size: 14px; color: var(--muted); }
.qas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.qa { text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.qa:hover:not(:disabled) { border-color: var(--accent); }
.qa:disabled { opacity: .45; cursor: not-allowed; }
.qa span { font: 13px var(--f-num); color: var(--muted); }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 12px; }
.mini span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.mini b { font-size: 18px; }
.cal { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.cal div { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; }
.cal div.on { border-color: var(--accent); }
.cal span { font-size: 12.5px; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 12px; scrollbar-width: none; }
.chips button { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.chips button.on { background: var(--paper); color: #1b1a17; border-color: var(--paper); font-weight: 600; }
h2.sec { font-size: 22px; margin: 26px 0 12px; }
.hero .tag { font: 600 clamp(20px, 3vw, 26px)/1.3 var(--f-display); color: var(--paper); margin: 0; }
.how { list-style: none; counter-reset: s; padding: 0; margin: 0 0 22px; display: grid; gap: 10px; max-width: 560px; }
.how li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; align-items: start; }
.how li::before { content: counter(s); grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; font: 600 15px var(--f-num); }
.how b { font-size: 16px; }
.how span { color: var(--muted); font-size: 14px; }

/* ---------- effets, estimation, programme ---------- */
.result { position: fixed; left: 50%; transform: translateX(-50%); bottom: 82px; z-index: 40; width: min(560px, 94vw); background: var(--raise); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.dl { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted); }
.dl b { font-family: var(--f-num); font-weight: 600; color: var(--text); }
.dl.up { border-color: rgba(95,174,120,.5); } .dl.up b { color: var(--good); }
.dl.down { border-color: rgba(224,97,79,.5); } .dl.down b { color: var(--bad); }
.big { font: 600 34px/1.1 var(--f-num); }
.spark { width: 100%; height: 64px; display: block; }
.est .bars { margin-top: 10px; }
.mes { background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; }
.mes .mt { font: 600 17px/1.3 var(--f-display); margin: 6px 0 2px; }
.lvl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 7px; border-radius: 4px; }
.lvl.local { background: #2f5e46; color: #e8f3ec; } .lvl.national { background: #2f4470; color: #e6ecf8; }
.star { font-size: 12px; color: var(--warn); font-weight: 700; }

/* ---------- parti ---------- */
.ladder { display: flex; flex-wrap: wrap; gap: 6px; }
.ladder div { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px 5px 5px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.ladder span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--f-num); background: var(--raise); }
.ladder .done { color: var(--text); } .ladder .done span { background: var(--paper); color: #1b1a17; }
.ladder .on { border-color: var(--accent); color: var(--text); font-weight: 600; } .ladder .on span { background: var(--accent); color: #fff; }
.big2 { font: 600 24px/1.2 var(--f-num); }

/* ---------- programme & équipe ---------- */
.prob { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.prob:hover { border-color: var(--accent); }
.prob .lvl { align-self: flex-start; }
.drow { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.drow b { font-family: var(--f-num); font-weight: 600; text-align: right; }
.src { font-size: 11.5px; color: var(--muted); margin: -2px 0 4px; }
.staff { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; background: var(--raise); }
input[type=range] { accent-color: var(--accent); }

.zone { border-top: 1px solid var(--line); padding: 10px 0; }
.zone:first-of-type { border-top: 0; }

/* ---------- accueil & création ---------- */
.hero { max-width: 760px; margin: 5vh auto 0; padding: 0 16px 40px; }
.hero .kicker { color: var(--accent); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
.hero h1 { font: 800 clamp(56px, 12vw, 112px)/.9 var(--f-display); letter-spacing: -.03em; margin: 10px 0 10px; }
.hero h1 span { color: var(--accent); }
.hero p { font: 400 18px/1.5 var(--f-display); color: #cfc9bb; max-width: 60ch; }
.hero p.small { font: 13px/1.5 var(--f-ui); color: var(--muted); }
.wizard { max-width: 720px; margin: 24px auto; padding: 0 16px 120px; }
.wizard .progress { height: 3px; background: var(--line); margin: 14px 0 22px; }
.wizard .progress i { display: block; height: 100%; background: var(--accent); }
.wizard h2 { font-size: 28px; margin-bottom: 8px; }
.wizard .q { font: 500 22px/1.35 var(--f-display); margin: 18px 0; min-height: 3em; }
.likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
@media (max-width: 520px) { .likert { grid-template-columns: 1fr; } }
.likert button { padding: 12px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; font-size: 13.5px; }
.likert button:hover { border-color: var(--accent); }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .formgrid { grid-template-columns: 1fr; } }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
